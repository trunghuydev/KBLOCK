name: KBlock
options:
  bundleIdPrefix: dev.kblock
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
    ENABLE_BITCODE: NO

targets:
  KBlock:
    type: application
    platform: iOS
    sources:
      - path: KBlock
        excludes:
          - "Info.plist"
          - "*.entitlements"
    entitlements:
      path: KBlock/KBlock.entitlements
    settings:
      base:
        PRODUCT_NAME: KBlock
        PRODUCT_BUNDLE_IDENTIFIER: dev.kblock.KBlock
        INFOPLIST_FILE: KBlock/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: Extension
        embed: true
        codeSign: true

  Extension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources
        type: folder
        buildPhase: resources
    entitlements:
      path: Extension/Extension.entitlements
    settings:
      base:
        PRODUCT_NAME: Extension
        PRODUCT_MODULE_NAME: Extension
        PRODUCT_BUNDLE_IDENTIFIER: dev.kblock.KBlock.Extension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: NO

schemes:
  KBlock:
    build:
      targets:
        Extension: [build]
        KBlock: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

