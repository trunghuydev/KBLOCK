name: KBlock
options:
  bundleIdPrefix: dev.kblock
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0" # Swift 5 language mode — Xcode 16/26 reject "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_OPTIMIZATION: space
    ENABLE_NS_ASSERTIONS: NO
    # Xcode 26 packs debug builds into <Target>.debug.dylib, which breaks
    # embeddedBinaryValidationUtility on embedded .appex targets
    # ("Couldn't load Info dictionary"). Classic layout avoids it.
    ENABLE_DEBUG_DYLIB: NO

targets:
  KBlock:
    type: application
    platform: iOS
    sources:
      - path: KBlock
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: KBlock
        PRODUCT_BUNDLE_IDENTIFIER: dev.kblock.KBlock
        INFOPLIST_FILE: KBlock/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # App Group group.dev.kblock.shared — both targets MUST have it or
        # UserDefaults(suiteName:) returns nil on real devices and the app
        # cannot sync config with the extension.
        CODE_SIGN_ENTITLEMENTS: KBlock/KBlock.entitlements
    dependencies:
      - target: Extension
        embed: true
        codeSign: true
      - target: KBlockWidget
        embed: true
        codeSign: true

  KBlockWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KBlockWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: KBlockWidget
        PRODUCT_BUNDLE_IDENTIFIER: dev.kblock.KBlock.Widget
        INFOPLIST_FILE: KBlockWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: KBlockWidget/KBlockWidget.entitlements
        SKIP_INSTALL: YES

  Extension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      # Flat layout: manifest.json at the appex root, each web-extension
      # folder as its own folder reference (a nested "Resources" dir makes
      # the appex a non-standard shallow bundle and breaks validation).
      - path: Extension/Resources/manifest.json
        buildPhase: resources
      - path: Extension/Resources/background
        type: folder
        buildPhase: resources
      - path: Extension/Resources/content
        type: folder
        buildPhase: resources
      - path: Extension/Resources/popup
        type: folder
        buildPhase: resources
      - path: Extension/Resources/rules
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Extension
        PRODUCT_BUNDLE_IDENTIFIER: dev.kblock.KBlock.Extension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
