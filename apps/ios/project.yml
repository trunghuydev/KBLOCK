name: KBlock
options:
  bundleIdPrefix: dev.kblock
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
    ENABLE_BITCODE: NO

targets:
  KBlock:
    type: application
    platform: iOS
    sources:
      - path: KBlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kblock.KBlock
        INFOPLIST_FILE: KBlock/Info.plist
        CODE_SIGN_ENTITLEMENTS: KBlock/KBlock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: Extension

  Extension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kblock.KBlock.Extension
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
