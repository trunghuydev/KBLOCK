<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBlock</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <img src="../icons/icon-48.png" alt="KBlock" class="logo-icon" width="24" height="24" />
        <span class="logo-text">KBlock</span>
      </div>
      <label class="toggle-switch" id="toggle-label" aria-label="Bật/tắt KBlock">
        <input type="checkbox" id="main-toggle" checked />
        <span class="toggle-slider"></span>
      </label>
    </header>

    <!-- Status -->
    <main class="main-content">
      <div class="status-card" id="status-card">
        <div class="status-icon" id="status-icon" aria-hidden="true">🛡️</div>
        <div class="status-text">
          <div class="status-title" id="status-title">Đang bảo vệ</div>
          <div class="status-subtitle" id="status-subtitle">Quảng cáo đang bị chặn</div>
        </div>
      </div>

      <!-- Current domain info -->
      <div class="domain-section">
        <div class="domain-label">Trang hiện tại</div>
        <div class="domain-value" id="current-domain">Đang tải...</div>
        <button class="whitelist-btn" id="whitelist-btn" aria-label="Thêm vào whitelist">
          Thêm vào whitelist
        </button>
        <button class="whitelist-btn whitelist-btn--remove hidden" id="remove-whitelist-btn" aria-label="Xoá khỏi whitelist">
          Xoá khỏi whitelist
        </button>
      </div>

      <!-- Filter sources summary -->
      <div class="filters-section">
        <div class="section-title">Bộ lọc</div>
        <ul class="filter-list" id="filter-list" aria-label="Danh sách bộ lọc">
          <!-- Populated by popup.ts -->
        </ul>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="version" id="version-label">v0.1.0</span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a href="#" id="open-settings" class="footer-link">Cài đặt</a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
