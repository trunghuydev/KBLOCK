<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KBlock</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="ios-sheet-container">
    <!-- Master Toggle & Status Card -->
    <div class="status-banner" id="status-card">
      <div class="status-left">
        <div class="status-icon-wrap" id="status-icon-wrap">
          <svg class="status-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm-1 14.5l-4-4 1.41-1.41L11 13.67l6.59-6.59L19 8.5l-8 8z"/>
          </svg>
        </div>
        <div class="status-info">
          <span class="status-main" id="status-title">Đang bảo vệ</span>
          <span class="status-sub" id="status-subtitle">Quảng cáo & Pop-up đang bị chặn</span>
        </div>
      </div>

      <label class="ios-switch" aria-label="Bật/Tắt chặn">
        <input type="checkbox" id="main-toggle" checked />
        <span class="ios-slider"></span>
      </label>
    </div>

    <!-- Active Website Card -->
    <div class="card website-card">
      <div class="card-row">
        <div class="site-info">
          <span class="site-label">TRANG WEB HIỆN TẠI</span>
          <span class="site-domain" id="current-domain">Đang xác định...</span>
        </div>
        <span class="badge" id="site-status-pill">Đang lọc</span>
      </div>

      <button class="site-btn site-btn--pause" id="whitelist-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
        Tắt chặn trên trang này
      </button>

      <button class="site-btn site-btn--resume hidden" id="remove-whitelist-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Bật lại chặn trên trang này
      </button>
    </div>

    <!-- Stats & Filters Grid -->
    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-val">38.000+</span>
        <span class="stat-desc">Quy tắc hoạt động</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="filters-active">3 Bộ lọc</span>
        <span class="stat-desc">ABPVN, EasyList</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="sheet-footer">
      <span>KBlock v0.1.0 • Bảo vệ quyền riêng tư 100%</span>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
